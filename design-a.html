<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessories For Sale</title><style>@import url("https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@400;600&display=swap");body{margin:0;background:linear-gradient(180deg,#65f4ff,#ff8cd5);font-family:Fredoka,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.title{font-family:Pacifico,cursive;color:white;text-align:center;font-size:56px;text-shadow:3px 3px #ff4db8}.machine{display:grid;grid-template-columns:2fr 1fr;gap:15px}.glass{background:#111;padding:15px;border:10px solid silver;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.item{background:white;border-radius:12px;padding:8px;text-align:center;cursor:pointer}.item:hover{transform:scale(1.03)}svg{width:100%;height:110px}.panel{background:#ffc4e6;border-radius:20px;padding:15px}.lcd{background:#ff5ec7;color:white;padding:12px;border-radius:10px;text-align:center;font-weight:bold}.money{font-size:22px;margin:10px 0}.btn,.moneybtn{background:#65f4ff;border:none;padding:10px;border-radius:10px;margin:4px;cursor:pointer;font-family:inherit;font-weight:bold}.dispense{height:120px;background:#222;border-radius:12px;margin-top:10px;position:relative;overflow:hidden;color:#7dff9c;display:flex;justify-content:center;align-items:center}.fall{position:absolute;top:-80px;font-size:46px;animation:drop 1.5s forwards}@keyframes drop{to{top:35px}}.collection{margin-top:15px;background:white;border-radius:12px;padding:10px;min-height:120px}.colitem{display:inline-block;margin:5px;padding:5px;background:#e8ffff;border-radius:8px}</style></head><body><div class="wrap"><div class="title">Accessories For Sale</div><div class="machine"><div class="glass"><div class="grid">
<div class=item data-name='Butterfly Purse' data-price='12'>A1<svg viewBox='0 0 100 80'><rect x='20' y='30' width='60' height='35' rx='8' fill='#ff5ec7'/><path d='M30 30 Q50 5 70 30' stroke='white' stroke-width='4' fill='none'/></svg>$12</div>
<div class=item data-name='Blue Purse' data-price='12'>A2<svg viewBox='0 0 100 80'><rect x='20' y='30' width='60' height='35' rx='8' fill='#6beeff'/></svg>$12</div>
<div class=item data-name='Scarf' data-price='8'>A3<svg viewBox='0 0 100 80'><path d='M10 40 Q50 5 90 40 Q50 75 10 40' fill='#ff9cdc'/></svg>$8</div>
<div class=item data-name='Charm Necklace' data-price='10'>A4<svg viewBox='0 0 100 80'><circle cx='50' cy='40' r='20' fill='gold'/></svg>$10</div>
<div class=item data-name='Heels' data-price='15'>B1<svg viewBox='0 0 100 80'><path d='M20 55 L65 55 L80 30 L50 30 Z' fill='#ff5ec7'/></svg>$15</div>
<div class=item data-name='Bracelet' data-price='10'>B2<svg viewBox='0 0 100 80'><circle cx='50' cy='40' r='22' fill='none' stroke='silver' stroke-width='8'/></svg>$10</div>
<div class=item data-name='Star Earrings' data-price='9'>B3<svg viewBox='0 0 100 80'><polygon points='50,15 58,35 80,35 62,48 70,68 50,55 30,68 38,48 20,35 42,35' fill='gold'/></svg>$9</div>
<div class=item data-name='Mini Bag' data-price='11'>B4<svg viewBox='0 0 100 80'><rect x='25' y='28' width='50' height='35' rx='8' fill='#ad8cff'/></svg>$11</div>
</div></div><div class='panel'><div class='lcd' id='lcd'>Welcome! Select an item.</div><div class='money'>Balance: $<span id='bal'>50</span></div><button class='moneybtn' onclick='addMoney(5)'>+$5</button><button class='moneybtn' onclick='addMoney(10)'>+$10</button><div><button class='btn' onclick='buy()'>BUY SELECTED ITEM</button></div><div class='dispense' id='dispense'>Dispense Slot</div><div class='collection'><b>Your Collection</b><div id='collection'></div></div></div></div></div><script>let bal=50,sel=null;function sound(f){let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);o.start();g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);o.stop(a.currentTime+.2);}document.querySelectorAll('.item').forEach(i=>i.onclick=()=>{sel=i;sound(1200);lcd.textContent='Selected '+i.dataset.name+' $'+i.dataset.price;});function addMoney(v){bal+=v;balEl.textContent=bal;sound(900);}let balEl=document.getElementById('bal');function buy(){if(!sel)return;lcd.textContent='Dispensing '+sel.dataset.name;let p=+sel.dataset.price;if(bal<p){lcd.textContent='Not enough money';sound(300);return;}bal-=p;balEl.textContent=bal;sound(700);dispense.innerHTML='<div class="fall">★</div>';setTimeout(()=>{dispense.textContent=sel.dataset.name+' delivered!';let c=document.createElement('div');c.className='colitem';c.textContent=sel.dataset.name;collection.appendChild(c);},1500);}</script></body></html>
