<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avery Malbon | Image Generation Sequence</title><link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&display=swap" rel="stylesheet"><style>:root{--bg:#8AD4CE;--text:#030001;--accent:#F7608F}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;overflow-x:hidden}.loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99;transition:.5s}.spinner{position:absolute;right:32px;bottom:32px;width:48px;height:48px;border:3px solid var(--accent);border-radius:50%;animation:r 3s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.stars,.stars:before,.stars:after{position:fixed;inset:0;content:'';background-image:radial-gradient(#fff 1px,transparent 1px);background-size:120px 120px;opacity:.12;animation:d 80s linear infinite;pointer-events:none}@keyframes d{from{transform:translateY(0)}to{transform:translateY(-200px)}}.wrap{max-width:1400px;margin:auto;padding:32px}h1,h2{font-family:'Emilys Candy',cursive;letter-spacing:.02em}h1{font-size:2rem}.hero img{width:100%;height:70vh;object-fit:cover;border-radius:24px;border:2px solid var(--accent)}.buttons{display:flex;flex-wrap:wrap;gap:12px;margin:32px 0 64px}.buttons a{text-decoration:none;color:var(--text);border:2px solid var(--accent);padding:10px 16px;border-radius:16px;transition:.25s}.buttons a:hover{transform:translateY(-4px);background:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.grid:hover .card{opacity:.4}.card:hover{opacity:1!important}.card{transition:.25s;position:relative}.card img{width:100%;display:block;border-radius:18px;border:2px solid var(--accent)}.label{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.85);padding:8px 10px;border-radius:10px;color:var(--accent);opacity:0;transition:.25s}.card:hover .label{opacity:1}@media(max-width:767px){.wrap{padding:20px}.grid,.heroSplit{grid-template-columns:repeat(2,1fr);gap:16px}}</style></head><body><div class="loading"><div class="spinner"></div></div><div class="stars"></div><div class="wrap"><h1>Avery Malbon</h1><div class="hero"><img src="images/chair8.jpeg" alt="Final image"></div><div class="buttons"><a href="#i1">Image 1</a><a href="#i2">Image 2</a><a href="#i3">Image 3</a><a href="#i4">Image 4</a><a href="#i5">Image 5</a><a href="#i6">Image 6</a><a href="#i7">Image 7</a><a href="#i8">Image 8</a></div><div class="grid"><div class="card" id="i1">
	<img src="images/chair1.png"><div class="label">Generation 1</div></div><div class="card" id="i2"><img src="images/chair2.jpg"><div class="label">Generation 2</div></div><div class="card" id="i3"><img src="images/chair3.jpg"><div class="label">Generation 3</div></div><div class="card" id="i4"><img src="images/chair4.jpg"><div class="label">Generation 4</div></div><div class="card" id="i5"><img src="images/chair5.png"><div class="label">Generation 5</div></div><div class="card" id="i6"><img src="images/chair6.png"><div class="label">Generation 6</div></div><div class="card" id="i7"><img src="images/chair7.jpeg"><div class="label">Generation 7</div></div><div class="card" id="i8"><img src="images/chair8.jpeg"><div class="label">Generation 8</div></div></div></div><script>window.addEventListener('load',()=>setTimeout(()=>document.querySelector('.loading').style.opacity='0',500));</script></body></html>
